<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel QR Registration System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; padding-bottom: 50px; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .nav-tabs .nav-link.active { font-weight: bold; color: #0d6efd; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">Fuel QR Registration System</h2>

    <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="vehicles-tab" data-bs-toggle="tab" data-bs-target="#vehicles" type="button" role="tab">🚗 Vehicle Management (Task 1)</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="stations-tab" data-bs-toggle="tab" data-bs-target="#stations" type="button" role="tab">⛽ Station Management (Task 2)</button>
      </li>
    </ul>

    <div class="tab-content" id="myTabContent">

        <div class="tab-pane fade show active" id="vehicles" role="tabpanel">
            
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Register New Vehicle</h5>
                </div>
                <div class="card-body">
                    <form id="registrationForm">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label>Registration Number</label>
                                <input type="text" class="form-control" id="regNo" placeholder="e.g., ABC-1234" required>
                            </div>
                            <div class="col-md-6">
                                <label>Owner NIC</label>
                                <input type="text" class="form-control" id="ownerNic" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label>First Name</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="col-md-6">
                                <label>Last Name</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label>Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="col-md-4">
                                <label>Vehicle Model</label>
                                <input type="text" class="form-control" id="vehicleModel" placeholder="e.g., Toyota Vitz" required>
                            </div>
                            <div class="col-md-4">
                                <label>Fuel Type</label>
                                <select class="form-control" id="fuelType">
                                    <option value="Petrol">Petrol</option>
                                    <option value="Diesel">Diesel</option>
                                    <option value="Electric">Electric</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label>Nearest Station</label>
                                <input type="text" class="form-control" id="nearestStation" required>
                            </div>
                            <div class="col-md-6">
                                <label>Generated QR Code ID</label>
                                <input type="text" class="form-control" id="qrCode" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Register Vehicle</button>
                    </form>
                    <div id="statusMessage" class="mt-3" style="display: none;"></div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0">Search Vehicles</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 mb-2">
                            <select id="searchType" class="form-select">
                                <option value="regno">Registration Number</option>
                                <option value="firstname">First Name</option>
                                <option value="lastname">Last Name</option>
                                <option value="email">Email</option>
                                <option value="station">Nearest Station</option>
                                <option value="fuel">Fuel Type</option>
                                <option value="nic">Owner NIC</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-2">
                            <input type="text" id="searchValue" class="form-control" placeholder="Enter search value...">
                        </div>
                        <div class="col-md-2 mb-2">
                            <button id="searchBtn" class="btn btn-primary w-100">Search</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header bg-dark text-white d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
                    <h5 class="mb-0 text-center text-sm-start">Registered Vehicles</h5>
                    <button id="refreshBtn" class="btn btn-sm btn-light w-100 w-sm-auto">Refresh Data</button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped table-hover" id="vehiclesTable">
                            <thead class="table-secondary">
                                <tr>
                                    <th>Reg No</th>
                                    <th>Owner Name</th>
                                    <th>NIC</th>
                                    <th>Vehicle Model</th>
                                    <th>Fuel Type</th>
                                    <th>Nearest Station</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="stations" role="tabpanel">
            
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Add New Fuel Station</h5>
                </div>
                <div class="card-body">
                    <form id="stationForm">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label>Station ID</label>
                                <input type="text" class="form-control" id="stationId" placeholder="e.g., ST-001" required>
                            </div>
                            <div class="col-md-6">
                                <label>Station Name</label>
                                <input type="text" class="form-control" id="stationName" placeholder="e.g., Colombo Central" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label>Location</label>
                                <input type="text" class="form-control" id="location" required>
                            </div>
                            <div class="col-md-6">
                                <label>Fuel Capacity (Liters)</label>
                                <input type="number" class="form-control" id="capacity" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Add Station</button>
                    </form>
                    <div id="stationMessage" class="mt-3" style="display: none;"></div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Active Fuel Stations</h5>
                    <button id="refreshStationsBtn" class="btn btn-sm btn-light">Refresh Stations</button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped" id="stationsTable">
                            <thead class="table-secondary">
                                <tr>
                                    <th>Station ID</th>
                                    <th>Station Name</th>
                                    <th>Location</th>
                                    <th>Capacity (L)</th>
                                </tr>
                            </thead>
                            <tbody>
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-warning">
        <h5 class="modal-title">Edit Vehicle</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editForm">
            <input type="hidden" id="editRegNo">
            <div class="mb-3">
                <label>First Name</label>
                <input type="text" class="form-control" id="editFirstName" required>
            </div>
            <div class="mb-3">
                <label>Last Name</label>
                <input type="text" class="form-control" id="editLastName" required>
            </div>
            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control" id="editEmail" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function() {

    // ==========================================
    // TASK 1 LOGIC: VEHICLES
    // ==========================================

    function loadVehicles() {
        $.ajax({
            url: 'http://localhost:5000/api/vehicles',
            type: 'GET',
            dataType: 'json',
            success: function(vehicles) {
                const tbody = $('#vehiclesTable tbody');
                tbody.empty();
                vehicles.forEach(function(v) {
                    const row = `<tr>
                        <td><strong>${v.RegNo}</strong></td>
                        <td>${v.FirstName} ${v.LastName}</td>
                        <td>${v.OwnerNIC}</td>
                        <td>${v.VehicleModel}</td>
                        <td><span class="badge bg-info text-dark">${v.FuelType}</span></td>
                        <td>${v.NearestStation}</td>
                        <td>
                            <div class="d-flex gap-2">
                                <button class="btn btn-warning btn-sm edit-btn" style="width: 75px;" data-regno="${v.RegNo}">Edit</button>
                                <button class="btn btn-danger btn-sm delete-btn" style="width: 75px;" data-regno="${v.RegNo}">Delete</button>
                            </div>
                        </td>
                    </tr>`;
                    tbody.append(row);
                });
            }
        });
    }

    loadVehicles();
    $('#refreshBtn').on('click', function() { loadVehicles(); });

    $('#registrationForm').on('submit', function(e) {
        e.preventDefault();
        const vehicleData = {
            RegNo: $('#regNo').val(),
            OwnerNIC: $('#ownerNic').val(),
            FirstName: $('#firstName').val(),
            LastName: $('#lastName').val(),
            Email: $('#email').val(),
            VehicleModel: $('#vehicleModel').val(),
            FuelType: $('#fuelType').val(),
            NearestStation: $('#nearestStation').val(),
            QRCode: $('#qrCode').val()
        };

        $.ajax({
            url: 'http://localhost:5000/api/vehicles/register',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(vehicleData),
            success: function() {
                $('#statusMessage').removeClass('alert-danger').addClass('alert alert-success').text('Vehicle registered successfully!').fadeIn();
                $('#registrationForm')[0].reset();
                setTimeout(() => $('#statusMessage').fadeOut(), 3000);
                loadVehicles();
            },
            error: function(xhr) {
                const errMsg = xhr.responseJSON ? xhr.responseJSON.message : 'Registration failed.';
                $('#statusMessage').removeClass('alert-success').addClass('alert alert-danger').text(errMsg).fadeIn();
            }
        });
    });

    $('#vehiclesTable').on('click', '.delete-btn', function() {
        const regNo = $(this).data('regno');
        if(confirm(`Delete vehicle ${regNo}?`)) {
            $.ajax({
                url: `http://localhost:5000/api/vehicles/regno/${regNo}`,
                type: 'DELETE',
                success: function() { loadVehicles(); }
            });
        }
    });

    $('#searchBtn').on('click', function() {
        const type = $('#searchType').val();
        const value = $('#searchValue').val();
        if (!value) { alert("Enter a search value"); return; }

        $.ajax({
            url: `http://localhost:5000/api/vehicles/${type}/${value}`,
            type: 'GET',
            success: function(data) {
                const tbody = $('#vehiclesTable tbody');
                tbody.empty();
                let vehicles = Array.isArray(data) ? data : [data];

                if (vehicles.length === 0 || !data) {
                    tbody.append('<tr><td colspan="7" class="text-center">No vehicles found.</td></tr>');
                    return;
                }

                vehicles.forEach(function(v) {
                    const row = `<tr>
                        <td><strong>${v.RegNo}</strong></td>
                        <td>${v.FirstName} ${v.LastName}</td>
                        <td>${v.OwnerNIC}</td>
                        <td>${v.VehicleModel}</td>
                        <td><span class="badge bg-info text-dark">${v.FuelType}</span></td>
                        <td>${v.NearestStation}</td>
                        <td>
                            <div class="d-flex gap-2">
                                <button class="btn btn-warning btn-sm edit-btn" style="width: 75px;" data-regno="${v.RegNo}">Edit</button>
                                <button class="btn btn-danger btn-sm delete-btn" style="width: 75px;" data-regno="${v.RegNo}">Delete</button>
                            </div>
                        </td>
                    </tr>`;
                    tbody.append(row);
                });
            },
            error: function() { alert("Vehicle not found."); }
        });
    });

    $('#vehiclesTable').on('click', '.edit-btn', function() {
        const regNo = $(this).data('regno');
        $.ajax({
            url: `http://localhost:5000/api/vehicles/regno/${regNo}`,
            type: 'GET',
            success: function(vehicle) {
                $('#editRegNo').val(vehicle.RegNo);
                $('#editFirstName').val(vehicle.FirstName);
                $('#editLastName').val(vehicle.LastName);
                $('#editEmail').val(vehicle.Email);
                $('#editModal').modal('show');
            }
        });
    });

    $('#editForm').on('submit', function(e) {
        e.preventDefault();
        const regNo = $('#editRegNo').val();
        const updatedData = {
            FirstName: $('#editFirstName').val(),
            LastName: $('#editLastName').val(),
            Email: $('#editEmail').val()
        };

        $.ajax({
            url: `http://localhost:5000/api/vehicles/regno/${regNo}`,
            type: 'PUT',
            contentType: 'application/json',
            data: JSON.stringify(updatedData),
            success: function() {
                $('#editModal').modal('hide');
                loadVehicles();
            }
        });
    });

    // ==========================================
    // TASK 2 LOGIC: FUEL STATIONS
    // ==========================================

    function loadStations() {
        $.ajax({
            url: 'http://localhost:5000/api/stations',
            type: 'GET',
            dataType: 'json',
            success: function(stations) {
                const tbody = $('#stationsTable tbody');
                tbody.empty();
                stations.forEach(function(s) {
                    const row = `<tr>
                        <td><strong>${s.StationID}</strong></td>
                        <td>${s.StationName}</td>
                        <td>${s.Location}</td>
                        <td><span class="badge bg-secondary">${s.FuelCapacity} L</span></td>
                    </tr>`;
                    tbody.append(row);
                });
            }
        });
    }

    // Load stations when tab is clicked
    $('#stations-tab').on('click', function() {
        loadStations();
    });

    $('#refreshStationsBtn').on('click', function() { loadStations(); });

    $('#stationForm').on('submit', function(e) {
        e.preventDefault();
        
        const stationData = {
            StationID: $('#stationId').val(),
            StationName: $('#stationName').val(),
            Location: $('#location').val(),
            FuelCapacity: $('#capacity').val()
        };

        $.ajax({
            url: 'http://localhost:5000/api/stations/add',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(stationData),
            success: function() {
                $('#stationMessage').removeClass('alert-danger').addClass('alert alert-success').text('Station added successfully!').fadeIn();
                $('#stationForm')[0].reset();
                setTimeout(() => $('#stationMessage').fadeOut(), 3000);
                loadStations();
            },
            error: function() {
                $('#stationMessage').removeClass('alert-success').addClass('alert alert-danger').text('Failed to add station.').fadeIn();
            }
        });
    });

});
</script>
</body>
</html>
