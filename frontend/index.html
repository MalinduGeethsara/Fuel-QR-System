<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel QR System - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/zephyr/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .dashboard-card { text-align: center; padding: 50px; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.05); background: white; max-width: 650px; width: 100%; }
        .btn-menu { padding: 20px; font-size: 1.2rem; border-radius: 12px; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .btn-menu:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="dashboard-card">
    <div class="mb-4 text-primary">
        <i class="fas fa-gas-pump fa-4x"></i>
    </div>
    <h1 class="mb-3 fw-bold">Fuel QR Registration System</h1>
    <p class="text-muted mb-5">Please select a management module to continue.</p>
    
    <div class="d-grid gap-4">
        <a href="vehicles.html" class="btn btn-primary btn-menu shadow-sm">
            <i class="fas fa-car-side fa-lg"></i> Vehicle Management
        </a>
        <a href="stations.html" class="btn btn-success btn-menu shadow-sm">
            <i class="fas fa-store fa-lg"></i> Station Management
        </a>
    </div>
</div>
</body>
</html>
